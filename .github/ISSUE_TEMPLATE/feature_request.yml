name: Feature request
description: Suggest a model, metric, plan or integration improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep the project's bar: any behaviour change needs a reproducible
        test, and no new untested entry point.
        请保持本仓库的标准：行为改动要带可复现测试，不新增未测试的入口。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What is hard or missing today? / 现在的痛点或缺失是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change / 建议方案
      description: What should the simulator do instead? / 希望模拟器如何改变？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 范围
      options:
        - Model semantics (emotion / compliance / physiology)
        - Calibration against real data
        - Metrics and reporting
        - Intervention plans
        - CLI / API / packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 检查项
      options:
        - label: I can write or help write the test for this. / 我可以编写或协助编写测试。
        - label: This is not a request for medical advice. / 这不是医疗建议请求。
          required: true
