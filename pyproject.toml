[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehealth-healthagent"
version = "0.2.0"
description = "A small, deterministic simulator of behavioural health-intervention adherence and physiology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ReHealth AI" }]
keywords = ["health", "simulation", "behavioural-science", "digital-health"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "openai>=1.40",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
plot = ["matplotlib>=3.8"]

[project.scripts]
rehealth-sim = "simulate:main"

[project.urls]
Homepage = "https://github.com/csong8904-spec/ReHealthAI-HealthAgent"

[tool.setuptools]
py-modules = ["simulate", "visualize"]

[tool.setuptools.packages.find]
include = ["healthagent*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
